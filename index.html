<script>(function(){var L=["zh-Hant", "en", "zh-Hans", "ja", "ko", "es", "fr", "de", "it", "pt-BR", "ru", "tr", "ar", "hi", "th", "vi", "id"];var l=navigator.languages||[navigator.language||'en'];
function pick(){for(var i=0;i<l.length;i++){var t=l[i];if(/^zh/i.test(t))return /hans|-cn|-sg|-my/i.test(t)?'zh-Hans':'zh-Hant';
if(/^pt/i.test(t))return 'pt-BR';var b=t.split('-')[0].toLowerCase();if(L.indexOf(b)>=0)return b;}return 'en';}
var p=pick();if(L.indexOf(p)<0)p='en';location.replace('/'+p+'/'+location.hash);})();</script>
